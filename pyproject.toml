[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "i24-measurement-module"
version = "0.1.0"
description = "Python libraries for acquisition and processing of EMG and respiratory signals using the HASOMED I24 system"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "science-mode-4>=0.0.23",
]


[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = [
    "i24_emg*",
    "i24_breathing_sensor*",
]
